version: '3.8'

services:
    sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        environment:
            SA_PASSWORD: "VerySecurePassword123!"
            ACCEPT_EULA: "Y"
        ports:
            - "1433:1433"
        volumes:
            - sqlvolume:/var/opt/mssql
        networks:
            - main-network
   
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
        container_name: es
        environment:
          - discovery.type=single-node
          - xpack.security.enabled=false     
          - ES_JAVA_OPTS=-Xms1g -Xmx1g    
        ports:
          - "9200:9200"   
          - "9300:9300"   
        volumes:
          - esdata:/usr/share/elasticsearch/data
        ulimits:
          memlock:
            soft: -1
            hard: -1
          nofile:
            soft: 65536
            hard: 65536
        healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost:9200"]
          interval: 10s
          timeout: 5s
          retries: 30

    redis:
        image: redis:latest
        ports:
            - "6379:6379"

    rabbitmq:
        image: rabbitmq:latest
        container_name: rabbitmq
        restart: always
        ports:
          - 5672:5672
          - 15672:15672
        environment:
          RABBITMQ_DEFAULT_USER: kalo
          RABBITMQ_DEFAULT_PASS: kalo
        configs:
          - source: rabbitmq-plugins
            target: /etc/rabbitmq/enabled_plugins
        volumes:
          - rabbitmq-lib:/var/lib/rabbitmq/
          - rabbitmq-log:/var/log/rabbitmq

configs:
    rabbitmq-plugins:
        content: "[rabbitmq_management]."  

volumes:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local
  sqlvolume:
  esdata:

networks:
    main-network:
    
